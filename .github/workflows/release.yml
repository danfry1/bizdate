name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/bizdate'

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG_NAME"

      # Put the lockfile-pinned npm (a devDependency, integrity-checked by bun
      # install) ahead of the runner's bundled npm for the rest of the job.
      - name: Use repo-pinned npm
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Full release gate (format, lint, knip, typecheck, coverage, packed smoke)
        run: bun run check:release

      - name: Build
        run: bun run build

      - name: Check package exports
        run: |
          npm pack --ignore-scripts --pack-destination /tmp
          bun run attw /tmp/bizdate-*.tgz

      - name: Generate SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > bizdate-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: bizdate-sbom.cdx.json

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing. The version is NOT installable until a
        # maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        # A prerelease version publishes under the "beta" dist-tag, so it never
        # becomes what `npm install bizdate` resolves to.
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          case "$VERSION" in
            *-*) TAG=beta ;;
            *) TAG=latest ;;
          esac
          echo "publishing $VERSION under dist-tag $TAG"
          npm stage publish --tag "$TAG"

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes bizdate-sbom.cdx.json
